                    - text: প্রতি ইউজারের জন্য 1 রিডেম্পশন সীমাবদ্ধ।
                    - text: শুধুমাত্র কিছু সংখ্যক নির্বাচিত ইউজারদের জন্য।
                    - text: ফুডপ্যান্ডা যেকোন সময় তার একক সিদ্ধান্ত এবং বিবেচনার
