  /api/v5/configuration/password-rules:
    options:
      summary: OPTIONS password-rules
      responses:
        '200':
          description: OK
          content: {}
    get:
      summary: GET password-rules
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type: number
                  data:
                    type: object
                    properties:
                      rules:
                        type: array
                        items:
                          type: object
                          properties:
                            regexp:
                              type: string
                            weight:
                              type: number
                            is_required:
                              type: boolean
                      grades:
                        type: object
                        properties:
                          middle:
                            type: number
                          strong:
                            type: number
                          weak:
                            type: number
              example:
                status_code: 200
                data:
                  rules:
                  - regexp: .+
                    weight: 1
                    is_required: true
                  - regexp: .{6}
                    data: '6'
                    weight: 10
                    is_required: true
                    translation_key: NEXTGEN_PASSWORD_MINIMAL_LENGTH
                  - regexp: '[A-Z]'
                    weight: 10
                    is_required: true
                    translation_key: NEXTGEN_PASSWORD_ONE_UPPERCASE_LETTER
                  - regexp: '[a-z]'
                    weight: 10
                    is_required: true
                    translation_key: NEXTGEN_PASSWORD_ONE_LOWERCASE_LETTER
                  - regexp: '[0-9]'
                    weight: 10
                    is_required: true
                    translation_key: NEXTGEN_PASSWORD_ONE_NUMBER
                  - regexp: "[ !\"#$%&'()*+,./:;<=>?@\\[\\]^_`{|}~\\\\-]"
                    weight: 10
                    is_required: false
                    translation_key: NEXTGEN_PASSWORD_ONE_SPECIAL_CHARACTER
                  - regexp: ^[\x00-\x7F]+$
                    weight: 100
                    is_required: true
                  grades:
                    middle: 140
                    strong: 150
                    weak: 1
